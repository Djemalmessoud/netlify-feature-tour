<!DOCTYPE html>
<html lang="ar">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SmartLoad</title>
  <style>
    body {
      margin: 0;
      font-family: 'Tahoma', sans-serif;
      background: linear-gradient(to right, #0f3d2e, #ffffff);
      color: #fff;
    }

    header {
      background-color: #0f3d2e;
      padding: 20px;
      text-align: center;
    }

    h1 {
      color: #e74c3c;
      font-size: 3em;
    }

    p {
      font-size: 1.4em;
      max-width: 600px;
      margin: 0 auto;
      padding: 10px;
    }

    section {
      text-align: center;
      padding: 60px 20px;
    }
  </style>
</head>
<body>
  <header>
    <h1>🚀 أهلاً بك في SmartLoad</h1>
    <p>منصة ذكية للألعاب، التطبيقات، المقالات، والأخبار التقنية</p>
  </header>

  <section>
    <h2>🎮 ألعاب</h2>
    <p>استمتع بأحدث الألعاب المختارة بعناية</p>

    <h2>📰 مقالات وأخبار</h2>
    <p>محتوى تقني مميز ومقالات ذكية</p>

    <h2>📱 تطبيقات</h2>
    <p>تطبيقات مفيدة ومجانية للتحميل</p>
  </section>
</body>
</html>
